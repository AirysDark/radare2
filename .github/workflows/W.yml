name: build-android-r2-snapshot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # IMPORTANT: use older runner

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang wget gperf \
            cabextract unzip \
            python3 python3-pip python3-setuptools \
            pax file

      - name: Build Android (snapshot native way)
        run: |
          sys/android-build.sh aarch64

      - name: Locate produced tarball
        run: |
          ls -lh *.tar.gz

      - name: Extract r2 from tarball
        run: |
          mkdir out
          tar -xzf radare2-*-android-aarch64*.tar.gz -C out
          find out -name r2
          cp $(find out -name r2 | head -n1) ./r2

      - name: Verify
        run: |
          file r2

      - uses: actions/upload-artifact@v4
        with:
          name: r2-android-aarch64
          path: r2
