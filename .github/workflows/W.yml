name: build-android-r2-snapshot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            clang \
            gperf \
            cabextract \
            unzip \
            python2 \
            pax \
            file

      - name: Set Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r21d" >> $GITHUB_ENV
          echo "NDK=$HOME/android-ndk-r21d" >> $GITHUB_ENV
          echo "PATH=$HOME/android-ndk-r21d/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV

      - name: Build radare2 for Android (aarch64)
        run: |
          export ANDROID_NDK_HOME=$HOME/android-ndk-r21d
          export NDK=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          sys/android-build.sh aarch64

      - name: Extract r2 binary
        run: |
          mkdir out
          tar -xzf radare2-*-android-aarch64*.tar.gz -C out
          cp $(find out -name r2 | head -n1) ./r2
          file r2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2-android-aarch64
          path: r2
