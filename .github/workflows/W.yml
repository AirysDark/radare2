name: build-android-static-r2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang gperf unzip cabextract \
            python3 python3-pip python3-setuptools file

      - name: Install Android NDK
        run: |
          sys/android-ndk-install.sh 28 aarch64

      - name: Configure minimal static build
        run: |
          export CFLAGS="-O2 -fPIC"
          ./configure \
            --with-compiler=android \
            --with-ostype=android \
            --disable-debugger \
            --disable-r2pm \
            --without-gpl \
            --without-qjs \
            --enable-static \
            --disable-shared

      - name: Build (safe memory mode)
        run: |
          make -j2

      - name: Collect r2
        run: |
          mkdir -p dist
          cp binr/radare2/r2 dist/r2

      - name: Strip
        run: |
          ${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-strip dist/r2 || true

      - name: Verify
        run: |
          file dist/r2
          ldd dist/r2 || true

      - uses: actions/upload-artifact@v4
        with:
          name: r2-android-arm64-static
          path: dist/r2
