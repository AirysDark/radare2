name: build-android-r2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang wget gperf \
            cabextract unzip python3 \
            pax file

      - name: Install NDK r17c (compatible with standalone toolchain)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q android-ndk-r17c-linux-x86_64.zip
          export NDK=$PWD/android-ndk-r17c
          python $NDK/build/tools/make_standalone_toolchain.py \
            --arch arm64 \
            --api 28 \
            --install-dir toolchain

      - name: Build Android r2
        run: |
          set -e
          export MAKEFLAGS="-j1"
          export CFLAGS="-O1"
          export CXXFLAGS="-O1"
          sys/android-build.sh aarch64

      - name: Extract r2
        run: |
          mkdir -p dist
          TAR=$(ls radare2-*-android-aarch64.tar.gz | head -n1)

          if [ -z "$TAR" ]; then
            echo "Tarball not found"
            exit 1
          fi

          tar -xzf "$TAR"
          R2=$(find . -type f -path "*android-aarch64*/data/*/bin/r2" | head -n1)

          if [ -z "$R2" ]; then
            echo "r2 not found"
            exit 1
          fi

          cp "$R2" dist/r2
          file dist/r2

      - uses: actions/upload-artifact@v4
        with:
          name: r2-android-arm64
          path: dist/r2
