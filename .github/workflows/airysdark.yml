name: build-android-r2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang wget gperf \
            cabextract unzip \
            python3 python3-pip python3-setuptools \
            pax file

      - name: Install Android NDK
        run: |
          sys/android-ndk-install.sh 24 aarch64

      - name: Build Android (official path)
        run: |
          set -e
          export MAKEFLAGS="-j1"
          export CFLAGS="-O1"
          export CXXFLAGS="-O1"

          # DO NOT export NDK
          # Let android-build.sh handle shell re-exec

          sys/android-build.sh aarch64

      - name: Extract r2
        run: |
          mkdir -p dist
          TAR=$(ls radare2-*-android-aarch64.tar.gz | head -n1)
          if [ -z "$TAR" ]; then
            echo "No tarball produced"
            exit 1
          fi

          tar -xzf "$TAR"
          R2=$(find . -type f -path "*aarch64*/bin/r2" | head -n1)

          if [ -z "$R2" ]; then
            echo "r2 not found"
            exit 1
          fi

          cp "$R2" dist/r2
          file dist/r2

      - uses: actions/upload-artifact@v4
        with:
          name: r2-android-arm64
          path: dist/r2
