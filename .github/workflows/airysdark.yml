name: build-android-r2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build \
            python3 python3-pip \
            gperf cabextract unzip \
            file wget

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip

      - name: Configure environment
        run: |
          export NDK=$PWD/android-ndk-r26d
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export SYSROOT=$TOOLCHAIN/sysroot
          export TARGET=aarch64-linux-android24

          echo "NDK=$NDK" >> $GITHUB_ENV
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV
          echo "TARGET=$TARGET" >> $GITHUB_ENV

      - name: Configure Meson
        run: |
          meson setup build \
            --buildtype=release \
            -Dc_args="--target=$TARGET --sysroot=$SYSROOT" \
            -Dc_link_args="--target=$TARGET --sysroot=$SYSROOT" \
            -Dcpp_args="--target=$TARGET --sysroot=$SYSROOT" \
            -Dcpp_link_args="--target=$TARGET --sysroot=$SYSROOT"

      - name: Build
        run: |
          ninja -C build -j2

      - name: Extract r2
        run: |
          mkdir -p dist
          cp build/binr/radare2/r2 dist/r2
          file dist/r2

      - uses: actions/upload-artifact@v4
        with:
          name: r2-android-arm64
          path: dist/r2
