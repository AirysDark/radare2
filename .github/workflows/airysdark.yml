name: build-android-r2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang wget gperf \
            cabextract unzip \
            python3 python3-pip python3-setuptools \
            pax file

      - name: Install Android NDK
        run: |
          sys/android-ndk-install.sh 24 aarch64

      - name: Build (stable Android mode)
        run: |
          export MAKEFLAGS="-j2"
          export CFLAGS="-O1"
          export CXXFLAGS="-O1"

          # Locate NDK directory installed by script
          NDK_DIR=$(find $HOME -maxdepth 2 -type d -name "android-ndk*" | head -n 1)
          echo "NDK_DIR=$NDK_DIR"

          export ANDROID_NDK_ROOT="$NDK_DIR"
          export ANDROID_NDK_HOME="$NDK_DIR"
          export PATH="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          sys/android-build.sh aarch64

      - name: Extract r2 binary
        run: |
          mkdir -p dist
          R2_PATH=$(find . -type f -path "*aarch64*/bin/r2" | head -n 1)
          if [ -z "$R2_PATH" ]; then
            echo "r2 not found"
            find . -type f -name r2
            exit 1
          fi
          cp "$R2_PATH" dist/r2

      - name: Strip
        run: |
          strip dist/r2 || true

      - name: Verify
        run: |
          file dist/r2
          ldd dist/r2 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2-android-arm64
          path: dist/r2
