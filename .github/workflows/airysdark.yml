name: build-android-r2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # Checkout source with submodules
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install required build dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build \
            python3 python3-pip \
            gperf cabextract unzip \
            clang file wget

      # Download Android NDK
      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip

      # Create Meson cross file with proper sysroot
      - name: Create Meson cross file
        run: |
          NDK_PATH="$PWD/android-ndk-r26d"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"

          echo "Using NDK at $NDK_PATH"
          echo "Using sysroot at $SYSROOT"

          cat <<EOF > android-aarch64.txt
          [binaries]
          c = '${TOOLCHAIN}/bin/aarch64-linux-android24-clang'
          cpp = '${TOOLCHAIN}/bin/aarch64-linux-android24-clang++'
          ar = '${TOOLCHAIN}/bin/llvm-ar'
          strip = '${TOOLCHAIN}/bin/llvm-strip'

          [properties]
          sys_root = '${SYSROOT}'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      # Configure Meson
      - name: Configure
        run: |
          meson setup build \
            --cross-file android-aarch64.txt \
            --buildtype release

      # Build (limit parallelism to avoid OOM)
      - name: Build
        run: |
          ninja -C build -j2

      # Extract r2 binary
      - name: Extract r2
        run: |
          mkdir -p dist
          cp build/binr/radare2/r2 dist/r2
          file dist/r2

      # Upload artifact
      - uses: actions/upload-artifact@v4
        with:
          name: r2-android-arm64
          path: dist/r2
