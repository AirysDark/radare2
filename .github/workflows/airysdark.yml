name: build-android-r2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang wget gperf \
            cabextract unzip python3 \
            pax file

      - name: Build Android r2 (official supported path)
        run: |
          set -e

          # Prevent CI OOM
          export MAKEFLAGS="-j1"
          export CFLAGS="-O1"
          export CXXFLAGS="-O1"

          # Install NDK + create standalone toolchain
          sys/android-ndk-install.sh 28 aarch64

          # IMPORTANT:
          # Do NOT export NDK manually.
          # Do NOT override toolchain.
          # Let scripts use ./toolchain

          sys/android-build.sh aarch64

      - name: Extract r2 from tarball
        run: |
          mkdir -p dist
          TAR=$(ls radare2-*-android-aarch64.tar.gz | head -n1)

          if [ -z "$TAR" ]; then
            echo "Tarball not found"
            exit 1
          fi

          tar -xzf "$TAR"
          R2=$(find . -type f -path "*android-aarch64*/data/*/bin/r2" | head -n1)

          if [ -z "$R2" ]; then
            echo "r2 binary not found inside tarball"
            exit 1
          fi

          cp "$R2" dist/r2
          file dist/r2

      - uses: actions/upload-artifact@v4
        with:
          name: r2-android-arm64
          path: dist/r2
