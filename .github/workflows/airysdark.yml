name: build-android-r2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build \
            python3 python3-pip \
            gperf cabextract unzip \
            clang file

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Create meson cross file
        run: |
          cat <<EOF > android-aarch64.txt
          [binaries]
          c = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
          cpp = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
          ar = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Configure Meson
        run: |
          meson setup build \
            --cross-file android-aarch64.txt \
            --buildtype release \
            -Dgpl=false

      - name: Build
        run: |
          ninja -C build

      - name: Copy r2
        run: |
          mkdir -p dist
          cp build/binr/radare2/r2 dist/r2
          file dist/r2

      - uses: actions/upload-artifact@v4
        with:
          name: r2-android-arm64
          path: dist/r2
