name: build-android-r2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make clang wget gperf \
            cabextract unzip \
            python3 python3-pip python3-setuptools \
            pax file

      - name: Install Android NDK
        run: |
          sys/android-ndk-install.sh 24 aarch64

      - name: Build (official android-build.sh)
        run: |
          set -e

          # Prevent OOM
          export MAKEFLAGS="-j1"
          export CFLAGS="-O1"
          export CXXFLAGS="-O1"

          # IMPORTANT: android-build.sh expects this
          export NDK="$HOME/android-ndk"

          # Run build
          sys/android-build.sh aarch64

      - name: Extract r2 binary
        run: |
          mkdir -p dist
          R2_PATH=$(find . -type f -path "*aarch64*/bin/r2" | head -n 1)
          if [ -z "$R2_PATH" ]; then
            echo "r2 not found"
            find . -type f -name r2
            exit 1
          fi
          cp "$R2_PATH" dist/r2
          file dist/r2

      - uses: actions/upload-artifact@v4
        with:
          name: r2-android-arm64
          path: dist/r2
